# Builds the plugin ZIP for a version tag (v<package.json version>) and attaches it to a GitHub release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Check tag matches package.json
        run: |
          version="v$(node -p 'require("./package.json").version')"
          test "$GITHUB_REF_NAME" = "$version" || { echo "Tag $GITHUB_REF_NAME does not match $version"; exit 1; }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and package
        run: pnpm run package

      - uses: astral-sh/setup-uv@v6

      - name: Run tests
        run: uv run --python 3.14 --with pytest --with aiohttp python -m pytest

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/HotBar.zip --title "HotBar $GITHUB_REF_NAME" --generate-notes
